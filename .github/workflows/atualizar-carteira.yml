name: Atualizar carteira

on:
  # 22:00 UTC = 19:00 em Brasília (UTC-3, sem horário de verão desde 2019),
  # depois do fechamento da B3 (18:00) e da publicação da PTAX de fechamento.
  # Dias úteis apenas. O agendador do GitHub pode atrasar em horários de pico.
  schedule:
    - cron: "0 22 * * 1-5"
  # Permite disparar manualmente pela aba Actions — use isto no primeiro teste.
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Testes
        run: npm test

      # Diagnóstico temporário: mede a FORMA dos secrets, nunca o conteúdo.
      # Um PAT do Airtable tem 17 caracteres de id + 1 ponto + 64 hexadecimais = 82.
      # Remova este passo depois que a autenticação estiver funcionando.
      - name: Diagnostico dos secrets
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: |
          echo "AIRTABLE_TOKEN: ${#AIRTABLE_TOKEN} caracteres (esperado 82)"
          case "$AIRTABLE_TOKEN" in
            *.*) echo "AIRTABLE_TOKEN: contem ponto separador — SIM" ;;
            *)   echo "AIRTABLE_TOKEN: contem ponto separador — NAO (provavel Token ID em vez do token)" ;;
          esac
          case "$AIRTABLE_TOKEN" in
            pat*) echo "AIRTABLE_TOKEN: comeca com pat — SIM" ;;
            *)    echo "AIRTABLE_TOKEN: comeca com pat — NAO" ;;
          esac
          LIMPO=$(printf '%s' "$AIRTABLE_TOKEN" | tr -d '[:space:]')
          echo "AIRTABLE_TOKEN: ${#LIMPO} caracteres apos remover espacos e quebras de linha"
          echo "BRAPI_TOKEN: ${#BRAPI_TOKEN} caracteres"

      - name: Atualizar carteira
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: npm start
